[project]
name = "manufacturing-economic-monitor"
version = "0.1.0"
description = "CLI and dashboard for FRED manufacturing economic data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "streamlit>=1.36",
]

[project.scripts]
manufacturing-monitor = "manufacturing_monitor.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "manufacturing_monitor"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
